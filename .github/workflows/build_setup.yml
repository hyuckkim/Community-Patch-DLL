name: Build-Setup

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ master ]
    tags:
      - 'Release-*'  # Triggers on official releases (always builds)
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [ master ]
  workflow_dispatch:  # Manual trigger (always builds, skips path filter)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  get-version:
    name: Extract Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git describe

      - name: Get Version
        id: version
        shell: bash
        run: |
          # Get version using git describe --long (matches update_commit_id.bat)
          FULL_VERSION=$(git describe --tags --long 2>/dev/null || echo "No-Tag-$(git rev-parse --short HEAD)")
          
          # Extract version same way as minidump code (remove prefix before first '-')
          # "Release-5.1.3-0-g9fb5755" → "5.1.3-0-g9fb5755"
          # "No-Tag-abc123d" → "abc123d"
          VERSION=$(echo "$FULL_VERSION" | sed 's/^[^-]*-//')
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Full version: $FULL_VERSION"
          echo "Artifact version: $VERSION"

  detect-changes:
    if: github.event.pull_request.draft == false && !startsWith(github.ref, 'refs/tags/')
    name: Detect File Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dll-source: ${{ steps.filter.outputs.dll-source }}
      build-scripts: ${{ steps.filter.outputs.build-scripts }}
      workflow: ${{ steps.filter.outputs.workflow }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ''
          filters: |
            dll-source:
              - 'CvGameCoreDLL_Expansion2/**'
              - 'CvGameCoreDLLUtil/**'
              - 'CvGameDatabase/**'
              - 'CvLocalization/**'
              - 'CvWorldBuilderMap/**'
              - 'FirePlace/**'
              - 'ThirdPartyLibs/**'
              - '*.cpp'
              - '*.h'
            build-scripts:
              - 'build_vp_clang*.py'
              - 'update_commit_id.bat'
            workflow:
              - '.github/workflows/**'
            dependencies:
              - '*.sln'
              - '*.vcxproj'

      - name: Changes Summary
        run: |
          echo "### 🔍 File Changes Summary" >> $GITHUB_STEP_SUMMARY
          echo "- DLL Source: ${{ steps.filter.outputs.dll-source == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Scripts: ${{ steps.filter.outputs.build-scripts == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: ${{ steps.filter.outputs.workflow == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies: ${{ steps.filter.outputs.dependencies == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY

  setup:
    needs: [get-version, detect-changes]
    if: |
      always() && needs.get-version.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/Release-') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && 
        (needs.detect-changes.outputs.dll-source == 'true' || 
         needs.detect-changes.outputs.build-scripts == 'true' || 
         needs.detect-changes.outputs.workflow == 'true' || 
         needs.detect-changes.outputs.dependencies == 'true')))
    runs-on: windows-2022
    steps:

      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            ./wget
            ./SDK7
            ./SDK7.1
          key: ${{ runner.os }}-sdks-wget-1.21.3-sdk7.0sp1-sdk7.1-v4

      - name: Install wget
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Installing wget..."
          mkdir wget
          Invoke-WebRequest -Uri https://eternallybored.org/misc/wget/1.21.3/64/wget.exe -OutFile "wget\wget.exe"
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\wget"
          echo "wget installation complete."

      - name: Download Windows SDK 7.0 SP1 and 7.1
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Downloading SDKs..."
          wget -nv -O ./sdk7.iso --tries=1 --timeout=120 https://web.archive.org/web/20161230154527/http://download.microsoft.com/download/2/E/9/2E911956-F90F-4BFB-8231-E292A7B6F287/GRMSDK_EN_DVD.iso
          wget -nv -O ./sdk71.iso --tries=1 --timeout=120 http://download.microsoft.com/download/F/1/0/F10113F5-B750-4969-A255-274341AC6BCE/GRMSDK_EN_DVD.iso

          if [ ! -s ./sdk7.iso ]; then
            echo "Error: sdk7.iso is empty (0 bytes)"
            exit 1
          fi
          if [ ! -s ./sdk71.iso ]; then
            echo "Error: sdk71.iso is empty (0 bytes)"
            exit 1
          fi
          
          7z x ./sdk7.iso -y -o"./SDK7"
          7z x ./sdk71.iso -y -o"./SDK7.1"
          echo "SDKs downloaded and extracted."
